name: baby_monitor_app
description: Caregiver app for the baby-monitor Pi — cry alerts over MQTT, care-event/history sync over local HTTP.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  mqtt_client: ^10.3.1
  http: ^1.2.1
  shared_preferences: ^2.2.3
  flutter_foreground_task: ^8.10.4
  uuid: ^4.4.0
  intl: ^0.19.0
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
